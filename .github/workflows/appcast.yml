name: Appcast

on:
  pull_request:
    paths:
      - ".github/workflows/appcast.yml"
      - "BuildScripts/appcast.sh"
      - "appcast/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/appcast.yml"
      - "BuildScripts/appcast.sh"
      - "appcast/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run appcast:render
